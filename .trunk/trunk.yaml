version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: v1.11.0
lint:
  disabled:
    - checkov
    - trufflehog
    - yamllint
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.3.1
    - git-diff-check
    - gitleaks@8.30.1
    - isort@8.0.1
    - markdownlint@0.48.0
    - prettier@3.8.3
    - ruff@0.15.11
  ignore:
    # The vendored organization code-review skill is installed at a pinned
    # revision, and org-routing.py check compares its resource files byte for
    # byte; formatting them would break the pin.
    - linters: [prettier, markdownlint]
      paths:
        - .github/skills/code-review/**
    # Generated by scripts/catalog.py and checked by its --check mode.
    - linters: [prettier]
      paths:
        - .claude-plugin/marketplace.json
        - .agents/plugins/marketplace.json
        - plugins/*/plugin.json
        - plugins/*/.claude-plugin/plugin.json
    # Vendored at the organization's approved revision; edited only upstream.
    - linters: [ALL]
      paths:
        - .github/skills/**
runtimes:
  enabled:
    - node@22.16.0
    - python@3.10.8
actions:
  disabled:
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
